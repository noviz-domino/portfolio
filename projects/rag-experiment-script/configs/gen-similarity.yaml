# "답변 생성 + 채점" 단계를 켜서 실행하는 실험 설정 (검색 전략: similarity)
# gen-hybrid.yaml과는 search.strategy 값만 다르다. 나머지는 baseline.yaml과 전부 동일하다.
# 이 둘은 전략만 다르다 (similarity vs hybrid) — 프롬프트/채점 조건을 똑같이 두고
# 검색 전략만 바꿨을 때 답변 품질(Judge 점수)이 어떻게 달라지는지 비교하기 위한 실험 쌍이다.

experiment_name: gen-similarity        # 결과가 outputs/<이 이름>/ 폴더에 저장된다

data:
  pdf_dir: ../data/public                                          # 검색 대상 PDF 폴더
  golden_set: ../data/public/public_paragraph_golden_set.json       # 정답 데이터(35문항)

models:
  embedding: gemini-embedding-2       # 문서와 질문을 벡터로 바꾸는 모델
  llm: gemini-3.5-flash-lite          # rerank / 답변 생성 / 채점에 쓰는 모델

chunk:
  size: 700          # 청크 하나의 최대 글자 수
  overlap: 100       # 앞 청크와 겹치는 글자 수 (문장이 잘리는 것을 완화)

search:
  strategy: similarity   # similarity | mmr | bm25 | hybrid  ← 넷 중 하나
  k: 5                   # 검색해서 LLM에 넘길 문서 개수
  mmr:                   # strategy가 mmr일 때만 사용된다
    fetch_k: 20          # 후보를 20개 뽑아서 그중 다양성을 고려해 k개 선택
    lambda_mult: 0.5     # 1에 가까울수록 관련성 우선, 0에 가까울수록 다양성 우선
  hybrid:                # strategy가 hybrid일 때만 사용된다
    weights: [0.5, 0.5]  # [벡터검색 가중치, BM25 가중치]

rerank:
  enabled: false   # true면 검색 결과를 LLM으로 재정렬한다
  top_n: 5         # rerank에 넘길 후보 수 (LLM 호출 수 = 문항 수 × 이 값)

evaluation:
  retrieval_limit: 35      # 검색 지표(Hit/MRR) 계산에 쓸 문항 수
  llm_limit: 10            # rerank·생성·채점에 쓸 문항 수 (비용 때문에 줄임) — 생성이 이 10문항에서 돈다
  run_generation: true     # true면 검색 결과로 실제 답변을 생성한다
  run_judge: true          # true면 생성한 답변을 LLM이 채점한다
  context_k: 5              # 답변 생성 프롬프트에 넣을 검색 문서 수
  prompt_path: prompts/grounded.txt   # 답변 생성에 쓸 프롬프트 파일 (prompts/basic.txt 로 바꿔서 비교 가능)

pacing:
  embed_batch_size: 10   # 문서 임베딩을 몇 개씩 묶어 보낼지
  embed_sleep_sec: 12    # 배치 간 대기 → 분당 5배치 = 약 2만 토큰/분 (무료 티어 분당 3만 토큰의 67%)
  llm_sleep_sec: 5       # LLM 호출 사이 대기 → 분당 12회 (분당 15회 한도의 80%)
  max_retries: 5         # 429가 나면 대기 시간을 늘려가며 몇 번까지 재시도할지
